version: 2
# Keep GitHub Actions SHA pins and package dependencies current (review S-23).
# Updates are grouped so a weekly run opens one Actions PR and one PR for
# minor/patch package bumps; major package bumps still arrive one per PR so
# they can be judged individually.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK-managed packages are pinned by the SDK (see
      # node_modules/expo/bundledNativeModules.json, often to exact versions)
      # and must move together via `npx expo install --fix` on an SDK upgrade.
      # Dependabot never proposes them — not even patches.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      # `expo install --check` expects jest ~29.7 / @types/jest 29.5 for SDK 57.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # Expo SDK 57 targets TypeScript ~6.0, and ts-jest 29 rejects TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-expo 57 (via eslint-plugin-import) supports ESLint <= 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
